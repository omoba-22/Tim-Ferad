<!doctype html>
<html lang="en">
<head>{{> head title="Staff sign in" description="Staff area." noindex=true }}</head>
<body class="bg-ash-50 font-sans text-ash-900">
  <main id="main" class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
    <div class="card">
      <h1 class="text-2xl font-bold text-brand-700">{{siteName}} staff</h1>
      <p class="mt-1 text-ash-600">Sign in to manage trips, bookings and delivery orders.</p>
      <form id="login-form" class="mt-6 space-y-4" novalidate>
        <div>
          <label for="email" class="block text-sm font-semibold">Email address</label>
          <input id="email" name="email" type="email" required maxlength="254" autocomplete="username" class="field">
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold">Password</label>
          <input id="password" name="password" type="password" required maxlength="200" autocomplete="current-password" class="field">
        </div>
        <div id="form-error" class="notice" role="alert" hidden></div>
        <button id="submit" type="submit" class="btn-primary w-full">Sign in</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/admin/login.js"></script>
</body>
</html>
