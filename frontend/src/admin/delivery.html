<!doctype html>
<html lang="en">
<head>{{> head title="Delivery orders" description="Staff area." noindex=true }}</head>
<body class="bg-ash-50 font-sans text-ash-900">
  {{> admin-header }}
  <main id="main" class="mx-auto max-w-6xl px-4 py-8">
    <h1 class="text-2xl font-bold">Delivery orders</h1>

    <form id="search-form" class="card mt-6 grid gap-4 sm:grid-cols-[1fr_12rem_auto] sm:items-end" role="search">
      <div>
        <label for="q" class="block text-sm font-semibold">Reference, name, phone or email</label>
        <input id="q" name="q" type="search" maxlength="60" autocomplete="off" class="field">
      </div>
      <div>
        <label for="status" class="block text-sm font-semibold">Status</label>
        <select id="status" name="status" class="field">
          <option value="">All</option>
          <option value="pending_review">Pending review</option>
          <option value="confirmed">Confirmed</option>
          <option value="picked_up">Picked up</option>
          <option value="in_transit">In transit</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">
        <i data-lucide="search" class="h-5 w-5"></i> Search
      </button>
    </form>

    <p id="count" class="mt-4 text-sm text-ash-600" role="status"></p>
    <p id="action-error" class="notice mt-2" role="alert" hidden></p>
    <div id="orders" class="mt-2 space-y-3" aria-live="polite"><p>Loading delivery orders...</p></div>
  </main>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/admin/delivery.js"></script>
</body>
</html>
